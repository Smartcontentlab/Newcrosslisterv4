[build]
  publish = "netlify-dist"
  command = "pnpm run build:netlify"

[functions]
  directory = "netlify-dist/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

