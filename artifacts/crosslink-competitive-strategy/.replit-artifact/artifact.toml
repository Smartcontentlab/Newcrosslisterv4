kind = "slides"
previewPath = "/crosslink-competitive-strategy/"
title = "Crosslink X Competitive Strategy"
description = "A stakeholder-ready competitive strategy deck for Crosslink X, comparing resale software platforms, identifying repeatable product patterns, and defining the opportunity for an AI operating system that connects sourcing, listing, selling, fulfillment, and business intelligence."
version = "1.0.0"
id = "artifacts/crosslink-competitive-strategy"
