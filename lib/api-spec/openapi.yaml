openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ListFlow AI Resale Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: items
    description: Inventory items
  - name: listings
    description: Marketplace listings
  - name: orders
    description: Orders management
  - name: shipping
    description: Shipping workflow
  - name: analytics
    description: Business analytics
  - name: ai
    description: AI features
  - name: buy-scanner
    description: Temporary buy decisions and saved shopping candidates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Items (Inventory) ──────────────────────────────────────────────────────
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List all inventory items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, sold, archived]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Create a new inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/stale:
    get:
      operationId: listStaleItems
      tags: [items]
      summary: List stale inventory items (active but not sold in 30+ days)
      responses:
        "200":
          description: Stale items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get a single item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Listings ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: List all marketplace listings
      parameters:
        - name: itemId
          in: query
          schema:
            type: integer
        - name: marketplace
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, ended, sold, draft]
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a listing for an item on a marketplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a single listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingPatch"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /listings/{id}/health:
    get:
      operationId: getListingHealth
      tags: [listings]
      summary: Get AI health score and improvement tips for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingHealth"
        "404":
          description: Not found

  # ── Orders ─────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, awaiting_shipment, shipped, delivered, returned, refunded]
        - name: marketplace
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (record a sale)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/recent:
    get:
      operationId: listRecentOrders
      tags: [orders]
      summary: Get recent order activity feed (last 10)
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPatch"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  # ── Shipping ───────────────────────────────────────────────────────────────
  /shipping:
    get:
      operationId: listShippingTasks
      tags: [shipping]
      summary: List shipping tasks (open items awaiting shipment)
      responses:
        "200":
          description: Shipping tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingTask"

  /shipping/{id}:
    get:
      operationId: getShippingTask
      tags: [shipping]
      summary: Get a shipping task for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipping task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingTask"
        "404":
          description: Not found
    patch:
      operationId: updateShippingTask
      tags: [shipping]
      summary: Update shipping task steps (check off steps)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingTaskPatch"
      responses:
        "200":
          description: Updated shipping task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingTask"
        "404":
          description: Not found

  # ── Analytics ──────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [analytics]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /analytics/marketplaces:
    get:
      operationId: getMarketplaceBreakdown
      tags: [analytics]
      summary: Get sales breakdown by marketplace
      responses:
        "200":
          description: Marketplace breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceStat"

  /analytics/monthly:
    get:
      operationId: getMonthlyRevenue
      tags: [analytics]
      summary: Get monthly revenue for the last 12 months
      responses:
        "200":
          description: Monthly revenue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyRevenue"

  /analytics/top-categories:
    get:
      operationId: getTopCategories
      tags: [analytics]
      summary: Get top selling categories
      responses:
        "200":
          description: Top categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  # ── AI ─────────────────────────────────────────────────────────────────────
  /ai/generate-listing:
    post:
      operationId: generateListing
      tags: [ai]
      summary: AI-generate listing details from item info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateListingRequest"
      responses:
        "200":
          description: Generated listing content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedListing"

  /ai/price-estimate:
    post:
      operationId: getPriceEstimate
      tags: [ai]
      summary: AI-estimate price for an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceEstimateRequest"
      responses:
        "200":
          description: Price estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceEstimate"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI business assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantReply"

  # ── Buy scanner ────────────────────────────────────────────────────────────
  /buy-scanner/evaluate:
    post:
      operationId: evaluateBuyScan
      tags: [buy-scanner]
      summary: Evaluate whether a shopper should buy an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyScanRequest"
      responses:
        "200":
          description: Buy recommendation and sold-comps evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyScanResult"
        "502":
          description: Sold-comps provider is unavailable

  /buy-scanner/candidates:
    get:
      operationId: listBuyCandidates
      tags: [buy-scanner]
      summary: List saved shopping candidates
      responses:
        "200":
          description: Saved candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuyCandidate"
    post:
      operationId: createBuyCandidate
      tags: [buy-scanner]
      summary: Save a shopping candidate without creating inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyCandidateInput"
      responses:
        "201":
          description: Saved candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyCandidate"

  /buy-scanner/candidates/{id}:
    delete:
      operationId: deleteBuyCandidate
      tags: [buy-scanner]
      summary: Remove a saved shopping candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Candidate removed
        "404":
          description: Candidate not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Item ──────────────────────────────────────────────────────────────────
    Item:
      type: object
      required: [id, title, status, price, cost, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        condition:
          type: string
          enum: [new, like_new, good, fair, poor]
        status:
          type: string
          enum: [draft, active, sold, archived]
        price:
          type: number
        cost:
          type: number
        weight:
          type: ["number", "null"]
        photos:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        listingCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemInput:
      type: object
      required: [title, price, cost, condition, status]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        brand:
          type: string
        model:
          type: string
        category:
          type: string
        condition:
          type: string
          enum: [new, like_new, good, fair, poor]
        status:
          type: string
          enum: [draft, active, sold, archived]
        price:
          type: number
          minimum: 0
        cost:
          type: number
          minimum: 0
        weight:
          type: number
          minimum: 0
        photos:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    ItemPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        brand:
          type: string
        model:
          type: string
        category:
          type: string
        condition:
          type: string
          enum: [new, like_new, good, fair, poor]
        status:
          type: string
          enum: [draft, active, sold, archived]
        price:
          type: number
          minimum: 0
        cost:
          type: number
          minimum: 0
        weight:
          type: number
          minimum: 0
        photos:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    # ── Listing ───────────────────────────────────────────────────────────────
    Listing:
      type: object
      required: [id, itemId, marketplace, status, price, createdAt, updatedAt]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]
        status:
          type: string
          enum: [draft, active, ended, sold]
        price:
          type: number
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        marketplaceListingId:
          type: ["string", "null"]
        listedAt:
          type: ["string", "null"]
          format: date-time
        soldAt:
          type: ["string", "null"]
          format: date-time
        itemTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListingInput:
      type: object
      required: [itemId, marketplace, price, status]
      properties:
        itemId:
          type: integer
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]
        status:
          type: string
          enum: [draft, active, ended, sold]
        price:
          type: number
          minimum: 0
        title:
          type: string
        description:
          type: string
        marketplaceListingId:
          type: string

    ListingPatch:
      type: object
      properties:
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]
        status:
          type: string
          enum: [draft, active, ended, sold]
        price:
          type: number
          minimum: 0
        title:
          type: string
        description:
          type: string
        marketplaceListingId:
          type: string
        listedAt:
          type: string
          format: date-time
        soldAt:
          type: string
          format: date-time

    ListingHealth:
      type: object
      required: [id, score, factors, tips]
      properties:
        id:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100
        grade:
          type: string
        factors:
          type: array
          items:
            $ref: "#/components/schemas/HealthFactor"
        tips:
          type: array
          items:
            type: string

    HealthFactor:
      type: object
      required: [name, score, maxScore]
      properties:
        name:
          type: string
        score:
          type: integer
        maxScore:
          type: integer
        passed:
          type: boolean

    # ── Order ─────────────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, itemId, marketplace, salePrice, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        listingId:
          type: ["integer", "null"]
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]
        buyerName:
          type: ["string", "null"]
        salePrice:
          type: number
        fees:
          type: number
        shippingCost:
          type: number
        profit:
          type: number
        status:
          type: string
          enum: [pending, awaiting_shipment, shipped, delivered, returned, refunded]
        trackingNumber:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        itemTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [itemId, marketplace, salePrice, status]
      properties:
        itemId:
          type: integer
        listingId:
          type: integer
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]
        buyerName:
          type: string
        salePrice:
          type: number
          minimum: 0
        fees:
          type: number
          minimum: 0
        shippingCost:
          type: number
          minimum: 0
        profit:
          type: number
        status:
          type: string
          enum: [pending, awaiting_shipment, shipped, delivered, returned, refunded]
        trackingNumber:
          type: string
        notes:
          type: string

    OrderPatch:
      type: object
      properties:
        buyerName:
          type: string
        salePrice:
          type: number
          minimum: 0
        fees:
          type: number
          minimum: 0
        shippingCost:
          type: number
          minimum: 0
        profit:
          type: number
        status:
          type: string
          enum: [pending, awaiting_shipment, shipped, delivered, returned, refunded]
        trackingNumber:
          type: string
        notes:
          type: string

    # ── Shipping ──────────────────────────────────────────────────────────────
    ShippingTask:
      type: object
      required: [id, orderId, steps, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        orderMarketplace:
          type: ["string", "null"]
        orderBuyerName:
          type: ["string", "null"]
        itemTitle:
          type: ["string", "null"]
        trackingNumber:
          type: ["string", "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ShippingStep"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShippingStep:
      type: object
      required: [key, label, completed]
      properties:
        key:
          type: string
        label:
          type: string
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
          format: date-time

    ShippingTaskPatch:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ShippingStepPatch"

    ShippingStepPatch:
      type: object
      required: [key, completed]
      properties:
        key:
          type: string
        completed:
          type: boolean

    # ── Analytics ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalRevenue, totalProfit, activeListings, totalInventory, pendingOrders, awaitingShipment, soldThisMonth, inventoryValue]
      properties:
        totalRevenue:
          type: number
        totalProfit:
          type: number
        activeListings:
          type: integer
        totalInventory:
          type: integer
        pendingOrders:
          type: integer
        awaitingShipment:
          type: integer
        soldThisMonth:
          type: integer
        inventoryValue:
          type: number
        avgSalePrice:
          type: number
        sellThroughRate:
          type: number

    MarketplaceStat:
      type: object
      required: [marketplace, totalSales, totalRevenue, totalProfit, activeListings]
      properties:
        marketplace:
          type: string
        totalSales:
          type: integer
        totalRevenue:
          type: number
        totalProfit:
          type: number
        activeListings:
          type: integer

    MonthlyRevenue:
      type: object
      required: [month, revenue, profit, sales]
      properties:
        month:
          type: string
        revenue:
          type: number
        profit:
          type: number
        sales:
          type: integer

    CategoryStat:
      type: object
      required: [category, totalSales, totalRevenue, avgPrice]
      properties:
        category:
          type: string
        totalSales:
          type: integer
        totalRevenue:
          type: number
        avgPrice:
          type: number

    # ── AI ────────────────────────────────────────────────────────────────────
    GenerateListingRequest:
      type: object
      required: [itemId, marketplace]
      properties:
        itemId:
          type: integer
        marketplace:
          type: string
          enum: [ebay, poshmark, depop, mercari, facebook, etsy, grailed, whatnot, shopify]

    GeneratedListing:
      type: object
      required: [title, description, tags, keywords]
      properties:
        title:
          type: string
        description:
          type: string
        tags:
